<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>とろママ 出勤表作成</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <h1>とろママ 出勤表作成</h1>
    </header>

    <main class="main-content">

        <!-- キャスト選択 -->
        <section class="cast-section">
            <h2>キャスト一覧</h2>
            <p class="description">
                お休みするキャストを選択してください。
            </p>

            <div class="cast-list">

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">だいすママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">ペンギンママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">花咲ママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">りりはママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">Ryuseiママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">よわねママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">めーぷるママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">すてらママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">uruママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">ルイママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">シルフィナママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">イヅキママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">ミンクママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <span class="cast-status"></span>
                    <span class="cast-name">huyutukiママ</span>
                </button>

            </div>
        </section>

        <!-- 作成 -->
        <section class="create-section">

            <button class="create-button" type="button">
                出勤表を作成
            </button>

        </section>

        <!-- プレビュー -->
        <section class="preview-section">
            <h2>プレビュー</h2>
            <div class="preview">
                <p>
                    ここに完成した出勤表が表示されます。
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>CastBoard</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
