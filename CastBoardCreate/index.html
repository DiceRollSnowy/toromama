<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>とろママ 出勤表作成</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <h1>とろママ 出勤表作成</h1>
    </header>

    <main class="main-content">

        <!-- 日付入力 -->
        <section class="date-section">
            <h2>開催日</h2>
            <p class="description">
                イベント開催日を入力してください。
            </p>
            <input type="date" id="event-date">
        </section>

        <!-- キャスト選択 -->
        <section class="cast-section">
            <h2>キャスト一覧</h2>
            <p class="description">
                お休みするキャストを選択してください。
            </p>

            <div class="cast-list">

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/02.png" alt="だいすママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">だいすママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/03.png" alt="ペンギンママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">ペンギンママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/04.png" alt="花咲ママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">花咲ママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/05.png" alt="りりはママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">りりはママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/06.png" alt="Ryuseiママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">Ryuseiママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/07.png" alt="よわねママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">よわねママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/08.png" alt="めーぷるママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">めーぷるママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/09.png" alt="すてらママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">すてらママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/10.png" alt="uruママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">uruママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/11.png" alt="ルイママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">ルイママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/12.png" alt="シルフィナママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">シルフィナママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/13.png" alt="イブキママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">イブキママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/14.png" alt="ミンクママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">ミンクママ</span>
                </button>

                <button class="cast-item is-working" type="button">
                    <img src="images/cast/15.png" alt="huyutukiママ">
                    <span class="cast-status"></span>
                    <span class="cast-name">huyutukiママ</span>
                </button>

            </div>
        </section>

        <!-- 作成 -->
        <section class="create-section">
            <button class="create-button" type="button">
                出勤表を作成
            </button>
        </section>

        <!-- プレビュー -->
        <section class="preview-section">
            <h2>プレビュー</h2>
            <div class="preview">
                <p>
                    ここに完成した出勤表が表示されます。
                </p>
            </div>
        </section>

        <section class="download-section">
            <button class="download-button" type="button">
                画像をダウンロード
            </button>
        </section>

    </main>

    <footer class="site-footer">
        <p>CastBoard</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
